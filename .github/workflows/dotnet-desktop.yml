name: .NET Core Desktop

on:
  push:
    branches: [ "develop", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: SoundTray.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # WiX is already installed, just find and add it to PATH
    - name: Setup WiX Toolset
      shell: pwsh
      run: |
        Write-Host "Searching for WiX Toolset installation..."
        $wixPaths = @(
          "C:\Program Files (x86)\WiX Toolset v3.14\bin",
          "C:\Program Files (x86)\WiX Toolset v3.11\bin"
        )
        
        $wixFound = $false
        foreach ($path in $wixPaths) {
          if (Test-Path $path) {
            Write-Host "WiX found at: $path"
            echo "$path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$path;$env:PATH"
            
            # Verify candle.exe and light.exe exist
            $candlePath = Join-Path $path "candle.exe"
            $lightPath = Join-Path $path "light.exe"
            if ((Test-Path $candlePath) -and (Test-Path $lightPath)) {
              Write-Host "Verified: WiX tools found"
              $wixFound = $true
            }
            break
          }
        }
        
        if (-not $wixFound) {
          Write-Error "WiX Toolset not found!"
          exit 1
        }

    # Restore only the .NET project (skip WiX projects)
    - name: Restore .NET Project
      run: dotnet restore SoundTray\SoundTray.csproj

    # Build x64 application
    - name: Build SoundTray x64
      run: msbuild SoundTray\SoundTray.csproj `
        /p:Configuration=${{ matrix.configuration }} `
        /p:Platform=x64 `
        /v:minimal

    # Build x86 application
    - name: Build SoundTray x86
      run: msbuild SoundTray\SoundTray.csproj `
        /p:Configuration=${{ matrix.configuration }} `
        /p:Platform=x86 `
        /v:minimal

    # Verify application was built
    - name: Verify Application Build
      shell: pwsh
      run: |
        Write-Host "Checking for built applications..."
        $x64Exe = "SoundTray\bin\x64\${{ matrix.configuration }}\net10.0-windows7.0\SoundTray.exe"
        $x86Exe = "SoundTray\bin\x86\${{ matrix.configuration }}\net10.0-windows7.0\SoundTray.exe"
        
        if (Test-Path $x64Exe) {
          Write-Host "✓ x64 application found: $x64Exe"
          Get-Item $x64Exe | Format-List
        } else {
          Write-Error "✗ x64 application NOT found at: $x64Exe"
          exit 1
        }
        
        if (Test-Path $x86Exe) {
          Write-Host "✓ x86 application found: $x86Exe"
          Get-Item $x86Exe | Format-List
        } else {
          Write-Error "✗ x86 application NOT found at: $x86Exe"
          exit 1
        }

    # Build 32-bit WiX Installer
    - name: Build WiX Installer (32-bit)
      shell: pwsh
      run: |
        Write-Host "========================================="
        Write-Host "Building 32-bit installer..."
        Write-Host "========================================="
        
        # Ensure WiX is in PATH
        $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
        if (-not (Test-Path $wixPath)) {
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
        }
        $env:PATH = "$wixPath;$env:PATH"
        
        # Build the installer
        msbuild SoundTrayInstaller32Bit\SoundTrayInstaller32Bit.wixproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=x86 `
          /v:detailed `
          /fl `
          /flp:LogFile=wix32-build.log
        
        $exitCode = $LASTEXITCODE
        
        # Show output directory contents
        Write-Host "`nChecking output directories:"
        $paths = @(
          "SoundTrayInstaller32Bit\bin\${{ matrix.configuration }}",
          "SoundTrayInstaller32Bit\bin\x86\${{ matrix.configuration }}"
        )
        foreach ($path in $paths) {
          if (Test-Path $path) {
            Write-Host "`n$path contents:"
            Get-ChildItem $path -Recurse | Select-Object FullName, Length
          }
        }
        
        if ($exitCode -ne 0) {
          Write-Error "32-bit installer build failed with exit code: $exitCode"
          if (Test-Path "wix32-build.log") {
            Write-Host "`n========== BUILD LOG (Last 100 lines) =========="
            Get-Content "wix32-build.log" | Select-Object -Last 100
          }
          exit $exitCode
        }

    # Build 64-bit WiX Installer
    - name: Build WiX Installer (64-bit)
      shell: pwsh
      run: |
        Write-Host "========================================="
        Write-Host "Building 64-bit installer..."
        Write-Host "========================================="
        
        # Ensure WiX is in PATH
        $wixPath = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
        if (-not (Test-Path $wixPath)) {
          $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
        }
        $env:PATH = "$wixPath;$env:PATH"
        
        # Build the installer
        msbuild SoundTrayInstaller64Bit\SoundTrayInstaller64Bit.wixproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:Platform=x64 `
          /v:detailed `
          /fl `
          /flp:LogFile=wix64-build.log
        
        $exitCode = $LASTEXITCODE
        
        # Show output directory contents
        Write-Host "`nChecking output directories:"
        $paths = @(
          "SoundTrayInstaller64Bit\bin\${{ matrix.configuration }}",
          "SoundTrayInstaller64Bit\bin\x64\${{ matrix.configuration }}"
        )
        foreach ($path in $paths) {
          if (Test-Path $path) {
            Write-Host "`n$path contents:"
            Get-ChildItem $path -Recurse | Select-Object FullName, Length
          }
        }
        
        if ($exitCode -ne 0) {
          Write-Error "64-bit installer build failed with exit code: $exitCode"
          if (Test-Path "wix64-build.log") {
            Write-Host "`n========== BUILD LOG (Last 100 lines) =========="
            Get-Content "wix64-build.log" | Select-Object -Last 100
          }
          exit $exitCode
        }

    # Verify installers were created
    - name: Verify Installer Build
      shell: pwsh
      run: |
        Write-Host "Checking for built installers..."
        
        # Check for x86 installer in multiple possible locations
        $x86Paths = @(
          "SoundTrayInstaller32Bit\bin\${{ matrix.configuration }}",
          "SoundTrayInstaller32Bit\bin\x86\${{ matrix.configuration }}"
        )
        
        $x86Msi = $null
        foreach ($path in $x86Paths) {
          if (Test-Path $path) {
            $found = Get-ChildItem -Path $path -Filter "*.msi" -ErrorAction SilentlyContinue
            if ($found) {
              $x86Msi = $found
              break
            }
          }
        }
        
        if ($x86Msi) {
          Write-Host "✓ x86 installer found:"
          $x86Msi | ForEach-Object { Write-Host "  - $($_.FullName) ($([math]::Round($_.Length/1MB, 2)) MB)" }
        } else {
          Write-Error "✗ x86 installer NOT found in any expected location"
        }
        
        # Check for x64 installer in multiple possible locations
        $x64Paths = @(
          "SoundTrayInstaller64Bit\bin\${{ matrix.configuration }}",
          "SoundTrayInstaller64Bit\bin\x64\${{ matrix.configuration }}"
        )
        
        $x64Msi = $null
        foreach ($path in $x64Paths) {
          if (Test-Path $path) {
            $found = Get-ChildItem -Path $path -Filter "*.msi" -ErrorAction SilentlyContinue
            if ($found) {
              $x64Msi = $found
              break
            }
          }
        }
        
        if ($x64Msi) {
          Write-Host "✓ x64 installer found:"
          $x64Msi | ForEach-Object { Write-Host "  - $($_.FullName) ($([math]::Round($_.Length/1MB, 2)) MB)" }
        } else {
          Write-Error "✗ x64 installer NOT found in any expected location"
          Write-Host "`nSearched in:"
          $x64Paths | ForEach-Object { Write-Host "  - $_" }
        }
        
        # Fail if no installers found
        if (-not $x86Msi -and -not $x64Msi) {
          Write-Error "No installers were created!"
          exit 1
        }

    # Upload build logs
    - name: Upload Build Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.configuration }}
        path: |
          *.log
          SoundTrayInstaller32Bit\obj\**\*.log
          SoundTrayInstaller64Bit\obj\**\*.log

    # Upload application artifacts (x64)
    - name: Upload SoundTray x64
      uses: actions/upload-artifact@v4
      with:
        name: SoundTray-App-x64-${{ matrix.configuration }}
        path: SoundTray\bin\x64\${{ matrix.configuration }}\**\*

    # Upload application artifacts (x86)
    - name: Upload SoundTray x86
      uses: actions/upload-artifact@v4
      with:
        name: SoundTray-App-x86-${{ matrix.configuration }}
        path: SoundTray\bin\x86\${{ matrix.configuration }}\**\*

    # Upload 32-bit installer (check both possible paths)
    - name: Upload 32-bit Installer
      uses: actions/upload-artifact@v4
      with:
        name: SoundTray-Installer-x86-${{ matrix.configuration }}
        path: |
          SoundTrayInstaller32Bit\bin\${{ matrix.configuration }}\*.msi
          SoundTrayInstaller32Bit\bin\x86\${{ matrix.configuration }}\*.msi

    # Upload 64-bit installer (check both possible paths)
    - name: Upload 64-bit Installer
      uses: actions/upload-artifact@v4
      with:
        name: SoundTray-Installer-x64-${{ matrix.configuration }}
        path: |
          SoundTrayInstaller64Bit\bin\${{ matrix.configuration }}\*.msi
          SoundTrayInstaller64Bit\bin\x64\${{ matrix.configuration }}\*.msi

  # Create GitHub Release when pushing tags
  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      shell: pwsh
      run: |
        Write-Host "Downloaded artifacts structure:"
        Get-ChildItem -Path artifacts -Recurse | Select-Object FullName, Length

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/SoundTray-Installer-x64-Release/**/*.msi
          artifacts/SoundTray-Installer-x86-Release/**/*.msi
        body: |
          ## SoundTray Release ${{ github.ref_name }}
          
          ### Downloads
          - **64-bit Windows Installer** - For 64-bit Windows systems
          - **32-bit Windows Installer** - For 32-bit Windows systems
          
          ### Installation
          1. Download the appropriate installer for your system
          2. Run the MSI installer
          3. Follow the installation wizard
          
          ### System Requirements
          - Windows 7 or later
          - .NET 10 Runtime
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}